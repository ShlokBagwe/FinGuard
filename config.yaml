paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models

raw_files:
  users: users_data.csv
  cards: cards_data.csv
  transactions: transactions_data.csv
  fraud_labels: train_fraud_labels.json

interim_files:
  users: users_clean.parquet
  cards: cards_clean.parquet
  transactions: transactions_clean.parquet
  master: master.parquet

processed_files:
  classification: df_classification.parquet
  velocity: df_velocity.parquet
  train: train.parquet
  test: test.parquet

split:
  train_ratio: 0.8
  time_column: transaction_datetime

features:
  # Redundant features dropped after correlation analysis.
  drop_correlated:
    - amount_vs_avg
    - per_capita_income
    - city_txn_count
  # High-VIF multicollinearity and redundant raw monetary features.
  drop_vif:
    - state_fraud_rate
    - state_avg_amount
    - state_unique_customers
    - mcc
    - customer_std_amount
    - yearly_income
    - total_debt
    - credit_limit
    - available_credit_per_card
    - credit_limit_to_income
  # Weak demographic features dropped after feature-importance selection.
  drop_low_importance:
    - credit_score
    - current_age
